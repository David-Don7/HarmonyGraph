name: harmonygraph
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: harmony
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-harmonygraph}
      POSTGRES_DB: harmonygraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony -d harmonygraph"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["harmonygraph", "migrate"]
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://harmony:${POSTGRES_PASSWORD:-local-harmonygraph}@db:5432/harmonygraph
      DATA_ROOT: /app/data
      HARMONY_CA_FILE: /app/data/local/network-root.pem
      CATALOG_DATABASE_BUDGET_GB: ${CATALOG_DATABASE_BUDGET_GB:-20}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *backend_environment
    volumes:
      - ./data:/app/data:ro
      - artifacts_data:/app/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    stop_grace_period: 30s
    build: .
    command: ["harmonygraph", "worker"]
    environment: *backend_environment
    volumes:
      - ./data:/app/data
      - artifacts_data:/app/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  metadata:
    stop_grace_period: 30s
    build: .
    command: ["harmonygraph", "worker"]
    environment:
      <<: *backend_environment
      JOB_KINDS: catalog_metadata
      METADATA_REQUEST_INTERVAL: "0.25"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  verify:
    profiles: ["verification"]
    build:
      context: .
      target: verification
    environment:
      DATABASE_URL: postgresql+psycopg://harmony:${POSTGRES_PASSWORD:-local-harmonygraph}@db:5432/harmonygraph_verification
      TEST_POSTGRES_URL: postgresql+psycopg://harmony:${POSTGRES_PASSWORD:-local-harmonygraph}@db:5432/harmonygraph_verification
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  artifacts_data:
