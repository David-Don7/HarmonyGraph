server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /api/ {
        # Docker can assign a new address when the API container is replaced.
        # Resolve the service at runtime instead of keeping the startup address.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $harmony_api http://api:8000;
        proxy_pass $harmony_api;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
