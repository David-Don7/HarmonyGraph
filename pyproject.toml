[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonygraph"
version = "0.1.0"
description = "Uncertainty-aware, section-sensitive harmonic retrieval research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.4",
  "SQLAlchemy==2.0.52", "alembic==1.19.1", "psycopg[binary]==3.3.4",
  "numpy==1.26.4", "scipy==1.14.1", "scikit-learn==1.5.2",
  "optuna==4.5.0", "click==8.1.7", "python-multipart==0.0.32"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.13.2"]
[project.scripts]
harmonygraph = "harmonygraph.cli:main"
[tool.setuptools.packages.find]
include = ["harmonygraph*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
