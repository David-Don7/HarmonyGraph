name: Verify HarmonyGraph
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: harmony
          POSTGRES_PASSWORD: test
          POSTGRES_DB: harmonygraph_test
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U harmony -d harmonygraph_test' --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://harmony:test@localhost:5432/harmonygraph_test
      - run: ruff check harmonygraph tests
      - run: npm ci && npm run build
        working-directory: web
      - run: harmonygraph migrate && harmonygraph demo
      - run: harmonygraph worker > /tmp/harmony-worker.log 2>&1 &
      - run: harmonygraph serve > /tmp/harmony-api.log 2>&1 &
      - run: npm run dev > /tmp/harmony-web.log 2>&1 &
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: web
